<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Premium deep space ocean twilight -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1E" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Aurora Glow Gradient -->
    <radialGradient id="auroraGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraGlow3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0.9" />
    </linearGradient>

    <!-- Member Circles Gradients -->
    <linearGradient id="jimmyCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="seaCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="avoceanCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
      fill: #FFFFFF;
    }
    .subtitle-text {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      fill: #94A3B8;
    }
    .badge-label {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .pill-text {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 20px;
    }
  </style>

  <!-- Deep Slate Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Aurora Ambient Glows -->
  <rect width="1200" height="630" fill="url(#auroraGlow1)" />
  <rect width="1200" height="630" fill="url(#auroraGlow2)" />
  <rect width="1200" height="630" fill="url(#auroraGlow3)" />

  <!-- Outer Ambient Glow Border -->
  <rect x="24" y="24" width="1152" height="582" rx="32" fill="none" stroke="url(#borderGlow)" stroke-width="2.5" opacity="0.6" />
  <rect x="28" y="28" width="1144" height="574" rx="28" fill="#0F172A" fill-opacity="0.5" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Floating Star Sparkles -->
  <circle cx="120" cy="110" r="3" fill="#FDE047" opacity="0.8" />
  <circle cx="280" cy="80" r="2.5" fill="#38BDF8" opacity="0.7" />
  <circle cx="1080" cy="140" r="3.5" fill="#C084FC" opacity="0.85" />
  <circle cx="950" cy="520" r="2" fill="#4ADE80" opacity="0.75" />
  <circle cx="160" cy="530" r="3" fill="#38BDF8" opacity="0.8" />

  <!-- Top Category Pill: Official Fan Hub -->
  <g transform="translate(600, 115)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#badgeShadow)" />
    <!-- Glowing indicator dot -->
    <circle cx="-160" cy="0" r="6" fill="#10B981" />
    <circle cx="-160" cy="0" r="10" fill="#10B981" opacity="0.3" />
    <text x="-140" y="6" class="badge-label" font-size="15" fill="#38BDF8">OFFICIAL FAN SCHEDULE &amp; CALENDAR</text>
  </g>

  <!-- Trio Signature Member Badges (Overlapping Trio) -->
  <g transform="translate(600, 215)" filter="url(#badgeShadow)">
    <!-- Jimmy Circle -->
    <g transform="translate(-70, 0)">
      <circle cx="0" cy="0" r="42" fill="url(#jimmyCircle)" stroke="#E9D5FF" stroke-width="3" />
      <text x="0" y="14" font-size="40" text-anchor="middle" dominant-baseline="middle">🥑</text>
    </g>

    <!-- Sea Circle -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="46" fill="url(#seaCircle)" stroke="#BAE6FD" stroke-width="3.5" />
      <text x="0" y="15" font-size="44" text-anchor="middle" dominant-baseline="middle">🌊</text>
    </g>

    <!-- Avocean Circle -->
    <g transform="translate(70, 0)">
      <circle cx="0" cy="0" r="42" fill="url(#avoceanCircle)" stroke="#BBF7D0" stroke-width="3" />
      <text x="0" y="14" font-size="40" text-anchor="middle" dominant-baseline="middle">💚</text>
    </g>
  </g>

  <!-- Main Title -->
  <text x="600" y="340" text-anchor="middle" class="title-text" font-size="52">JIMMY SEA AVOCEAN HUB</text>

  <!-- Subtitle -->
  <text x="600" y="390" text-anchor="middle" class="subtitle-text" font-size="22">
    Official Fan Schedule, Live Streams, Appearances &amp; Announcements
  </text>

  <!-- Feature Tags Row -->
  <g transform="translate(600, 460)">
    <!-- Pill 1: Jimmy -->
    <g transform="translate(-290, 0)">
      <rect x="-85" y="-20" width="170" height="40" rx="20" fill="#2E1065" stroke="#7C3AED" stroke-width="1.5" />
      <text x="-60" y="6" font-size="18">🥑</text>
      <text x="5" y="6" class="pill-text" fill="#C4B5FD" text-anchor="middle">Jimmy</text>
    </g>

    <!-- Pill 2: Sea -->
    <g transform="translate(-95, 0)">
      <rect x="-75" y="-20" width="150" height="40" rx="20" fill="#082F49" stroke="#0284C7" stroke-width="1.5" />
      <text x="-52" y="6" font-size="18">🌊</text>
      <text x="5" y="6" class="pill-text" fill="#7DD3FC" text-anchor="middle">Sea</text>
    </g>

    <!-- Pill 3: Avocean -->
    <g transform="translate(110, 0)">
      <rect x="-95" y="-20" width="190" height="40" rx="20" fill="#064E3B" stroke="#059669" stroke-width="1.5" />
      <text x="-70" y="6" font-size="18">💚</text>
      <text x="5" y="6" class="pill-text" fill="#6EE7B7" text-anchor="middle">Avocean</text>
    </g>

    <!-- Pill 4: GMMTV -->
    <g transform="translate(305, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="20" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="-48" y="6" font-size="16">✨</text>
      <text x="5" y="6" class="pill-text" fill="#CBD5E1" text-anchor="middle">GMMTV</text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(600, 540)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="15" fill="#64748B">
      📅 12H/24H Timezone Conversion · 🎫 Ticket &amp; Registration Windows · 🌐 Multilingual Translations
    </text>
  </g>
</svg>