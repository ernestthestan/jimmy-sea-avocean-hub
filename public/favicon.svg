<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Ocean Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <!-- Jimmy Violet Gradient -->
    <linearGradient id="jimmyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Sea Azure Gradient -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Avocean Green Gradient -->
    <linearGradient id="avoceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.5" filter="url(#shadow)" />

  <!-- Subtle glow ring inside -->
  <rect x="7" y="7" width="114" height="114" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- The Three Signature Overlapping JimmySea Avocean Badges -->
  <!-- 1. Jimmy Badge (Purple with Avocado) -->
  <g transform="translate(34, 64)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="23" fill="url(#jimmyGrad)" stroke="#E9D5FF" stroke-width="2.2" />
    <text x="0" y="7" font-size="22" text-anchor="middle" dominant-baseline="middle">🥑</text>
  </g>

  <!-- 2. Sea Badge (Azure Blue with Ocean Wave) -->
  <g transform="translate(64, 64)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="25" fill="url(#seaGrad)" stroke="#BAE6FD" stroke-width="2.5" />
    <text x="0" y="7" font-size="24" text-anchor="middle" dominant-baseline="middle">🌊</text>
  </g>

  <!-- 3. Avocean Badge (Green with Fandom Heart) -->
  <g transform="translate(94, 64)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="23" fill="url(#avoceanGrad)" stroke="#BBF7D0" stroke-width="2.2" />
    <text x="0" y="7" font-size="22" text-anchor="middle" dominant-baseline="middle">💚</text>
  </g>

  <!-- Small sparkling stars accent -->
  <circle cx="28" cy="28" r="2" fill="#FDE047" opacity="0.9" />
  <circle cx="100" cy="28" r="2.5" fill="#38BDF8" opacity="0.9" />
  <circle cx="64" cy="102" r="1.5" fill="#A855F7" opacity="0.8" />
</svg>
